name: Debug Router Build
on:
  push:
    branches:
      - feat/debug-actions

permissions:
  contents: write

jobs:
  debug-job:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get -y install wine64 g++-mingw-w64-x86-64 wine32:i386 g++-mingw-w64-i686
      - name: Validate the clean-room DDI declarations and negotiation
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -static \
            -Irelay12-d3d11/ddi -o d3d11ddilayout.exe tests/d3d11ddilayout.c > step11_c.txt 2>&1 || true
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -o d3d11ddilayoutxx.exe tests/d3d11ddilayout.c > step11_cxx.txt 2>&1 || true
          wine d3d11ddilayout.exe > wine1.txt 2>&1 || true
          wine d3d11ddilayoutxx.exe > wine2.txt 2>&1 || true
          
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -static \
            -Irelay12-d3d11 -Irelay12-d3d11/ddi -o d3d11ddinegotiate.exe \
            tests/d3d11ddinegotiate.c > step11_neg_c.txt 2>&1 || true
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static \
            -fno-exceptions -fno-rtti -Irelay12-d3d11 -Irelay12-d3d11/ddi -x c++ \
            -o d3d11ddinegotiatexx.exe tests/d3d11ddinegotiate.c > step11_neg_cxx.txt 2>&1 || true
          wine d3d11ddinegotiate.exe > wine3.txt 2>&1 || true
          wine d3d11ddinegotiatexx.exe > wine4.txt 2>&1 || true

      - name: Push to Branch
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add *.txt || true
          git commit -m "Step 11 logs" || true
          git push origin HEAD:feat/debug-actions || echo "Push failed"
