name: Debug Router Build
on:
  push:
    branches:
      - feat/debug-actions

permissions:
  contents: write

jobs:
  debug-job:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get -y install g++-mingw-w64-x86-64
      - name: Compile and audit D3D11 router
        run: |
          set -x
          x86_64-w64-mingw32-g++ -shared -std=c++17 -O2 \
            -Wall -Wextra -Werror -fno-exceptions -fno-rtti \
            -fno-threadsafe-statics -fno-use-cxa-atexit \
            -o d3d11on12core.dll relay12-d3d11/d3d11on12core.cpp \
            relay12-d3d11/wine_d3d11_diag.cpp \
            relay12-d3d11/d3d11on12core.def -ld3d12 -ldxgi -luuid > log.txt 2>&1
          x86_64-w64-mingw32-g++ -shared -std=c++17 -O2 \
            -Wall -Wextra -Werror -fno-exceptions -fno-rtti \
            -fno-threadsafe-statics -fno-use-cxa-atexit \
            -o d3d11shim.dll relay12-d3d11/d3d11shim.cpp \
            relay12-d3d11/wine_d3d11_diag.cpp \
            relay12-d3d11/d3d11shim.def -ld3d11 -ldxgi >> log.txt 2>&1
          core_exports="$(x86_64-w64-mingw32-objdump -p d3d11on12core.dll)"
          echo "$core_exports" > objdump_core.txt
          grep -q 'WineD3D11On12GetABIVersion' <<<"$core_exports" || echo "fail1" >> fails.txt
          grep -q 'WineD3D11On12CreateDeviceV1' <<<"$core_exports" || echo "fail2" >> fails.txt
          grep -q 'WineD3D11On12GetInterface' <<<"$core_exports" || echo "fail3" >> fails.txt
          exports="$(x86_64-w64-mingw32-objdump -p d3d11shim.dll)"
          echo "$exports" > objdump_shim.txt
          grep -q 'D3D11CreateDevice' <<<"$exports" || echo "fail4" >> fails.txt
          
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add log.txt objdump_core.txt objdump_shim.txt fails.txt || true
          git commit -m "Results" || true
          git push origin HEAD:feat/debug-actions || echo "Push failed"
