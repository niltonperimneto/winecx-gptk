name: build winecx gptk runtime
on:
  workflow_dispatch:
    inputs:
      opt:
        description: standard -O2, release -O3, fast -O0 for iteration only
        type: choice
        default: standard
        options:
          - standard
          - release
          - fast
      runtime_version:
        description: override the stamped version; leave empty for RUNTIME_SERIES.<commits since the series bump>
        type: string
      consumer_source_run_id:
        description: Recheck only the consumer against this existing build archive
        type: string
        default: ''
      rebuild_all:
        description: Rebuild OCI foundation, tools and payload layers instead of restoring cached layers
        type: boolean
        default: false
  push:
    branches:
      - main
      - feat/kosmickrisp-experimental
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - LICENSE
      - runtime-catalog.json
      - runtime-catalog-v2.json
  # Every pull request, including the pin bumps opened by bump-pins.yml,
  # builds the full runtime; cached layers make that cost only what changed.
  pull_request:
    paths-ignore: *docs
env:
  # All new layouts carry the same Vulkan provider.
  KOSMICKRISP_ENABLED: true
  RUNTIME_SERIES: "4.8"
  OPT_LEVEL: ${{ inputs.opt || 'standard' }}
  REBUILD_ALL: ${{ inputs.rebuild_all == true }}
  RUNTIME_VERSION_OVERRIDE: ${{ inputs.runtime_version || '' }}
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  static-qa:
    uses: ./.github/workflows/qa-common.yml
    permissions:
      contents: read
  checks:
    name: Build transport unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Ensure zstd is available
        run: command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zstd)
      - name: Test build contracts and existing runtime helpers
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  foundation:
    if: inputs.consumer_source_run_id == ''
    needs: [checks, static-qa]
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      sysroot: ${{ steps.restore_sysroot.outputs.ref || steps.push_sysroot.outputs.ref }}
      tools: ${{ steps.restore_tools.outputs.ref || steps.push_tools.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare macOS build host
        run: bash tools/bootstrap_build.sh
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Authenticate OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf "%s" "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-platforms = x86_64-darwin
      - name: Look up sysroot OCI layer
        id: restore_sysroot
        run: bash tools/build/oci.sh restore sysroot
      - name: Build pinned Darwin foundation
        if: steps.restore_sysroot.outputs.hit != 'true'
        run: |-
          bash tools/setup_mingw.sh
          bash tools/setup_sysroot.sh
      - name: Publish sysroot OCI layer
        id: push_sysroot
        if: steps.restore_sysroot.outputs.hit != 'true'
        run: bash tools/build/oci.sh push sysroot sysroot-closure.nar sysroot.env store-outs.txt native-store-outs.txt nix-tool-outs.txt llvm-mingw-20240619-ucrt-macos-universal
      - name: clone winecx
        uses: actions/checkout@v7
        with:
          repository: niltonperimneto/winecx
          ref: ${{ env.WINECX_COMMIT }}
          path: winecx
      - name: Prepare pinned Wine sources
        run: bash tools/prepare_source.sh
      - name: Look up tools OCI layer
        id: restore_tools
        run: bash tools/build/oci.sh restore tools
      - name: Build native Wine tools
        if: steps.restore_tools.outputs.hit != 'true'
        run: bash tools/build_wine_tools.sh
      - name: Publish tools OCI layer
        id: push_tools
        if: steps.restore_tools.outputs.hit != 'true'
        run: bash tools/build/oci.sh push tools build-tools
  payloads:
    if: inputs.consumer_source_run_id == ''
    needs: checks
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.restore_payloads.outputs.ref || steps.push_payloads.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare macOS build host
        run: bash tools/bootstrap_build.sh
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Authenticate OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf "%s" "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: clone winecx
        uses: actions/checkout@v7
        with:
          repository: niltonperimneto/winecx
          ref: ${{ env.WINECX_COMMIT }}
          path: winecx
      - name: Prepare pinned Wine sources
        run: bash tools/prepare_source.sh
      - name: Look up payloads OCI layer
        id: restore_payloads
        run: bash tools/build/oci.sh restore payloads
      - name: Fetch and verify graphics and addons
        if: steps.restore_payloads.outputs.hit != 'true'
        run: bash tools/fetch_payloads.sh
      - name: Publish payloads OCI layer
        id: push_payloads
        if: steps.restore_payloads.outputs.hit != 'true'
        run: bash tools/build/oci.sh push payloads addons payload
  # Mesa and loader inputs determine this layer; every new runtime installs it.
  graphics:
    if: inputs.consumer_source_run_id == ''
    needs: checks
    uses: ./.github/workflows/kosmickrisp.yml
    with:
      enabled: true
      rebuild_all: ${{ inputs.rebuild_all == true }}
    permissions:
      contents: read
      packages: write
  core:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    needs:
      - foundation
    outputs:
      ref: ${{ steps.restore_core.outputs.ref || steps.push_core.outputs.ref }}
      shippable: ${{ steps.core_status.outputs.shippable }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare macOS build host
        run: bash tools/bootstrap_build.sh
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Authenticate OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf "%s" "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-platforms = x86_64-darwin
      - name: Restore sysroot
        run: bash tools/build/oci.sh pull sysroot "${{ needs.foundation.outputs.sysroot }}"
      - name: Restore tools
        run: bash tools/build/oci.sh pull tools "${{ needs.foundation.outputs.tools }}"
      # Wine core is content-addressed by the Wine pin, its recipes and the
      # toolchain, so a payload or KosmicKrisp bump restores it unchanged.
      - name: Look up core OCI layer
        id: restore_core
        run: bash tools/build/oci.sh restore core
      - name: restore compiler cache
        if: steps.restore_core.outputs.hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ env.WINECX_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.WINECX_COMMIT }}-
            ccache-
      - name: clone winecx
        if: steps.restore_core.outputs.hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: niltonperimneto/winecx
          ref: ${{ env.WINECX_COMMIT }}
          path: winecx
      - name: Prepare pinned Wine sources
        if: steps.restore_core.outputs.hit != 'true'
        run: bash tools/prepare_source.sh
      - name: Configure compiler wrappers
        if: steps.restore_core.outputs.hit != 'true'
        run: bash tools/setup_mingw.sh --wrappers-only
      - name: Build Wine core
        id: make
        if: steps.restore_core.outputs.hit != 'true'
        run: |
          bash tools/build_wine_core.sh
          shippable=$(sed -n 's/^shippable=//p' "$GITHUB_OUTPUT" | tail -1)
          echo "shippable=${shippable:-true}" > core-status.env
      - name: Publish core OCI layer
        id: push_core
        if: steps.restore_core.outputs.hit != 'true'
        run: bash tools/build/oci.sh push core staging core-status.env
      # A restored layer carries the floor verdict of the build that made it.
      - name: Report core shippability
        id: core_status
        run: cat core-status.env >> "$GITHUB_OUTPUT"
  assemble:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    needs:
      - foundation
      - core
      - payloads
      - graphics
    outputs:
      ref: ${{ steps.push_assembled.outputs.ref }}
      runtime_version: ${{ steps.install.outputs.runtime_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare macOS build host
        run: bash tools/bootstrap_build.sh
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Authenticate OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf "%s" "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-platforms = x86_64-darwin
      - name: Restore sysroot
        run: bash tools/build/oci.sh pull sysroot "${{ needs.foundation.outputs.sysroot }}"
      - name: Restore core
        run: bash tools/build/oci.sh pull core "${{ needs.core.outputs.ref }}"
      - name: Restore payloads
        run: bash tools/build/oci.sh pull payloads "${{ needs.payloads.outputs.ref }}"
      - name: Assemble and sign runtime
        id: install
        run: bash tools/assemble_runtime.sh
      - name: Restore kosmickrisp
        run: bash tools/build/oci.sh pull kosmickrisp "${{ needs.graphics.outputs.ref }}"
      - name: Install KosmicKrisp payload
        run: bash tools/install_kosmickrisp.sh
      - name: Publish assembled OCI layer
        id: push_assembled
        run: bash tools/build/oci.sh push assembled Libraries
  build:
    name: Validate OCI runtime
    needs:
      - foundation
      - core
      - assemble
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      packages: write
    with:
      sysroot_ref: ${{ needs.foundation.outputs.sysroot }}
      assembled_ref: ${{ needs.assemble.outputs.ref }}
      runtime_version: ${{ needs.assemble.outputs.runtime_version }}
      shippable: ${{ needs.core.outputs.shippable }}
      kosmickrisp: true
      opt: ${{ inputs.opt || 'standard' }}
      artifact_name: whiskywine-gptk-libraries-kosmickrisp-experimental${{ inputs.opt == 'fast' && '-fast-unoptimised' || '' }}
  kosmickrisp-validation:
    name: KosmicKrisp / ${{ matrix.platform }} packaged runtime
    needs: build
    if: needs.build.outputs.kosmickrisp == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos26
            runner: ${{ vars.MACOS_GPU_RUNNER_26 || 'macos-26' }}
          - platform: newer
            runner: ${{ vars.MACOS_GPU_RUNNER_NEWER || 'macos-26' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: whiskywine-gptk-libraries-kosmickrisp-experimental${{ inputs.opt == 'fast' && '-fast-unoptimised' || '' }}
          path: downloaded
      - name: Require a trusted physical GPU runner
        env:
          GPU_RUNNER: ${{ matrix.platform == 'macos26' && vars.MACOS_GPU_RUNNER_26 || vars.MACOS_GPU_RUNNER_NEWER }}
        run: test -n "$GPU_RUNNER" || { echo '::error::Physical Metal 4 GPU runner is not configured for this OS lane'; exit 1; }
      - name: verify and unpack in a relocated directory
        run: |
          cd downloaded
          shasum -a 256 -c Libraries.tar.gz.sha256
          echo "RUNTIME_ARCHIVE_SHA256=$(cut -d' ' -f1 < Libraries.tar.gz.sha256)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/kosmickrisp relocated runtime"
          tar -xzf Libraries.tar.gz -C "$RUNNER_TEMP/kosmickrisp relocated runtime"
      - name: validate the packaged runtime on physical hardware
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          python3 runtime/kosmickrisp/validate.py \
            --libraries "$RUNNER_TEMP/kosmickrisp relocated runtime/Libraries" \
            --output "$PWD/kosmickrisp-results" --platform "${{ matrix.platform }}"
      - name: Run the pinned physical game campaign
        env:
          CAMPAIGN: ${{ vars.MACOS_GPU_CAMPAIGN }}
          CAMPAIGN_SHA256: ${{ vars.MACOS_GPU_CAMPAIGN_SHA256 }}
        run: |
          test -n "$CAMPAIGN" && test -n "$CAMPAIGN_SHA256" || {
            echo '::error::Licensed game fixtures and the frozen campaign harness must be provisioned'; exit 1;
          }
          echo "$CAMPAIGN_SHA256  $CAMPAIGN" | shasum -a 256 -c -
          python3 "$CAMPAIGN" --libraries "$RUNNER_TEMP/kosmickrisp relocated runtime/Libraries" \
            --output "$PWD/kosmickrisp-results" --archive-sha256 "$RUNTIME_ARCHIVE_SHA256"
          python3 runtime/kosmickrisp/promotion.py "$PWD/kosmickrisp-results" --attach
      - name: retain results even when a probe fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kosmickrisp-validation-results-${{ matrix.platform }}
          path: |
            kosmickrisp-results/
            !kosmickrisp-results/prefix/**
            !kosmickrisp-results/game-files/**
            !kosmickrisp-results/dxvk-*/*.dll
            !kosmickrisp-results/dxvk-*/*.exe
          if-no-files-found: error
          retention-days: 30
  kosmickrisp-readiness:
    name: KosmicKrisp / migration readiness (features and game evidence)
    needs: kosmickrisp-validation
    if: always() && needs.kosmickrisp-validation.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: kosmickrisp-validation-results-*
          path: kosmickrisp-results
      - name: require migration evidence
        run: |
          python3 runtime/kosmickrisp/readiness.py kosmickrisp-results/kosmickrisp-validation-results-macos26/results.json
          python3 runtime/kosmickrisp/readiness.py kosmickrisp-results/kosmickrisp-validation-results-newer/results.json --platform newer
          python3 runtime/kosmickrisp/promotion.py kosmickrisp-results
  consumer-validation:
    name: Whisky / packaged layout v2
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/consumer-runtime.yml
    with:
      artifact_name: whiskywine-gptk-libraries-kosmickrisp-experimental${{ inputs.opt == 'fast' && '-fast-unoptimised' || '' }}
  consumer-recheck:
    name: Whisky / recheck existing archive
    if: inputs.consumer_source_run_id != ''
    needs: [checks, static-qa]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/consumer-runtime.yml
    with:
      source_run_id: ${{ inputs.consumer_source_run_id }}
      artifact_name: whiskywine-gptk-libraries-kosmickrisp-experimental${{ inputs.opt == 'fast' && '-fast-unoptimised' || '' }}
  publish:
    name: publish the runtime release
    needs: [build, kosmickrisp-readiness, consumer-validation]
    if: github.ref == 'refs/heads/main' && vars.WHISKY_LAYOUT_V2_AVAILABLE == 'true' && needs.kosmickrisp-readiness.result == 'success' && needs.consumer-validation.result == 'success' && inputs.opt != 'fast' && needs.build.outputs.shippable != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The catalog push below authenticates with its own token; a persisted
          # GITHUB_TOKEN header would take precedence over it.
          persist-credentials: false
      - name: Load pinned build inputs
        run: sed -n 's/^export //p' tools/build/pins.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: whiskywine-gptk-libraries-kosmickrisp-experimental
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_VERSION: ${{ needs.build.outputs.runtime_version }}
        run: bash tools/publish_runtime.sh
      - name: publish the opt-in canary catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_VERSION: ${{ needs.build.outputs.runtime_version }}
          # main is protected and Whisky reads the catalog from main. A personal
          # repository cannot let the Actions app bypass that, but an admin can,
          # so the push goes through the owner's PAT rather than GITHUB_TOKEN.
          CATALOG_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CATALOG_TOKEN" ]; then
            echo "::error::HUB_DISPATCH_TOKEN is not set; protected main rejects the catalog commit from GITHUB_TOKEN"
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${CATALOG_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tag="runtime-canary-v$RUNTIME_VERSION"
          sha=$(cut -d' ' -f1 < Libraries.tar.gz.sha256)
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # "Wine version 11.19" in the pinned tree, never a hard-coded guess.
          wine_version=$(curl -fsSL "https://raw.githubusercontent.com/niltonperimneto/winecx/$WINECX_COMMIT/VERSION" | awk '{print $NF}')
          export WINE_VERSION="$wine_version"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main origin/main

            python3 - "$RUNTIME_VERSION" "$tag" "$sha" "$published_at" <<'PY'
          import json, os, sys

          version, tag, digest, published_at = sys.argv[1:]
          repository = os.environ["GH_REPO"]
          catalog = {
              "catalogVersion": 2,
              "runtimes": [{
                  "identifier": f"winecx-gptk-canary-{version}",
                  "version": version,
                  "channel": "canary",
                  "archiveURL": f"https://github.com/{repository}/releases/download/{tag}/Libraries.tar.gz",
                  "sha256": digest,
                  "minimumMacOS": "26.0",
                  "wineVersion": os.environ["WINE_VERSION"],
                  "runtimeLayoutVersion": 2,
                  "capabilities": {
                      "vulkanProvider": "kosmickrisp",
                      "gptkMajorVersions": [4],
                      "wsarecvmsg": True,
                      "ipv4ReceiveTOS": True,
                      "ipv6ReceiveTrafficClass": True,
                      "overlappedReceiveMessage": True,
                      "childLaunchPolicies": True,
                      "childLaunchPolicySchema": 1,
                      "gameModeProcessHost": True,
                      "graphicsClassifiers": ["d3d11", "dxgi", "d3d12", "d3d12core", "vulkan"],
                      "dxvk": True,
                      "dxmt": True,
                      "wined3d": True,
                      "wow64": True
                  },
                  "publishedAt": published_at
              }]
          }
          with open("runtime-catalog-v2.json", "w") as stream:
              json.dump(catalog, stream, indent=2)
              stream.write("\n")
          PY

            git add runtime-catalog-v2.json
            if git diff --cached --quiet; then
              echo "catalog already current"
              exit 0
            fi
            git commit -m "chore(runtime): publish canary $RUNTIME_VERSION [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep 2
          done
      - name: notify Whisky of the new runtime
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
          RUNTIME_VERSION: ${{ needs.build.outputs.runtime_version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HUB_DISPATCH_TOKEN is not set; Whisky was not notified"
            exit 0
          fi
          tag="runtime-canary-v$RUNTIME_VERSION"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          gh api repos/niltonperimneto/Whisky/dispatches \
            -f event_type=runtime-published \
            -F "client_payload[version]=$RUNTIME_VERSION" \
            -F "client_payload[archiveURL]=$base/Libraries.tar.gz" \
            -F "client_payload[sha256]=$(cut -d' ' -f1 < Libraries.tar.gz.sha256)" \
            -F "client_payload[manifestURL]=$base/RuntimeManifest.json" \
            -F "client_payload[hubCommit]=${{ github.sha }}" \
            -F "client_payload[runtimeLayoutVersion]=2"
  oci-images:
    name: Dockerfile OCI distribution images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - foundation
      - payloads
      - core
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare Dockerfile artifact contexts
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          mkdir -p .build/images
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - name: Fetch sysroot manifest by digest
        run: |-
          mkdir -p .build/images/sysroot
          oras pull "${{ needs.foundation.outputs.sysroot }}" --output .build/images/sysroot
          python3 tools/build/archive.py verify .build/images/sysroot sysroot
      - name: Build sysroot OCI transport image
        uses: docker/build-push-action@v6
        with:
          context: .build/images
          file: docker/Dockerfile
          target: sysroot
          push: true
          tags: ${{ steps.registry.outputs.registry }}/sysroot-image:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |-
            SOURCE_REVISION=${{ github.sha }}
            RUNTIME_VERSION=${{ needs.build.outputs.runtime_version }}
        id: image_sysroot
      - name: Fetch tools manifest by digest
        run: |-
          mkdir -p .build/images/tools
          oras pull "${{ needs.foundation.outputs.tools }}" --output .build/images/tools
          python3 tools/build/archive.py verify .build/images/tools tools
      - name: Build tools OCI transport image
        uses: docker/build-push-action@v6
        with:
          context: .build/images
          file: docker/Dockerfile
          target: tools
          push: true
          tags: ${{ steps.registry.outputs.registry }}/tools-image:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |-
            SOURCE_REVISION=${{ github.sha }}
            RUNTIME_VERSION=${{ needs.build.outputs.runtime_version }}
        id: image_tools
      - name: Fetch payloads manifest by digest
        run: |-
          mkdir -p .build/images/payloads
          oras pull "${{ needs.payloads.outputs.ref }}" --output .build/images/payloads
          python3 tools/build/archive.py verify .build/images/payloads payloads
      - name: Build payloads OCI transport image
        uses: docker/build-push-action@v6
        with:
          context: .build/images
          file: docker/Dockerfile
          target: payloads
          push: true
          tags: ${{ steps.registry.outputs.registry }}/payloads-image:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |-
            SOURCE_REVISION=${{ github.sha }}
            RUNTIME_VERSION=${{ needs.build.outputs.runtime_version }}
        id: image_payloads
      - name: Fetch core manifest by digest
        run: |-
          mkdir -p .build/images/core
          oras pull "${{ needs.core.outputs.ref }}" --output .build/images/core
          python3 tools/build/archive.py verify .build/images/core core
      - name: Build core OCI transport image
        uses: docker/build-push-action@v6
        with:
          context: .build/images
          file: docker/Dockerfile
          target: core
          push: true
          tags: ${{ steps.registry.outputs.registry }}/core-image:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |-
            SOURCE_REVISION=${{ github.sha }}
            RUNTIME_VERSION=${{ needs.build.outputs.runtime_version }}
        id: image_core
      - name: Fetch runtime manifest by digest
        run: |-
          mkdir -p .build/images/runtime
          oras pull "${{ needs.build.outputs.ref }}" --output .build/images/runtime
          python3 tools/build/archive.py verify .build/images/runtime runtime
      - name: Build runtime OCI transport image
        uses: docker/build-push-action@v6
        with:
          context: .build/images
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.registry.outputs.registry }}/runtime-image:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |-
            SOURCE_REVISION=${{ github.sha }}
            RUNTIME_VERSION=${{ needs.build.outputs.runtime_version }}
        id: image_runtime
      - name: Compose and export development inputs with Dockerfile
        run: |
          docker buildx build -f docker/compose.Dockerfile --target assembly-inputs \
            --build-arg "SYSROOT_IMAGE=${{ steps.registry.outputs.registry }}/sysroot-image@${{ steps.image_sysroot.outputs.digest }}" \
            --build-arg "TOOLS_IMAGE=${{ steps.registry.outputs.registry }}/tools-image@${{ steps.image_tools.outputs.digest }}" \
            --build-arg "CORE_IMAGE=${{ steps.registry.outputs.registry }}/core-image@${{ steps.image_core.outputs.digest }}" \
            --build-arg "PAYLOADS_IMAGE=${{ steps.registry.outputs.registry }}/payloads-image@${{ steps.image_payloads.outputs.digest }}" \
            --output type=local,dest=.build/composed .
          for component in sysroot tools core payloads; do
            python3 tools/build/archive.py verify ".build/composed/winecx/$component" "$component"
          done
