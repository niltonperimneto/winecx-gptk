name: OCI driver integration test
on:
  push:
    branches:
      - codex/oci-build-ci
    paths:
      - .github/workflows/oci-ci-test.yml
  workflow_dispatch: null
permissions:
  contents: read
  packages: write
jobs:
  graphics:
    uses: ./.github/workflows/kosmickrisp.yml
    with:
      enabled: true
      rebuild_all: false
  restore-driver:
    name: Restore driver and test relocation
    needs: graphics
    runs-on: ${{ vars.MACOS_GPU_RUNNER || 'macos-26' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap macOS
        run: bash tools/bootstrap_build.sh
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf "%s" "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Restore driver by digest
        env:
          DRIVER_REF: ${{ needs.graphics.outputs.ref }}
        run: bash tools/build/oci.sh pull kosmickrisp "$DRIVER_REF"
      - name: Verify fresh-runner linkage in a relocated directory
        run: |
          mkdir -p "$RUNNER_TEMP/relocated driver"
          cp -R payload/kosmickrisp "$RUNNER_TEMP/relocated driver/bundle"
          /usr/bin/clang -arch x86_64 -Wall -Wextra -Werror tests/dlopenall.c -o "$RUNNER_TEMP/relocated driver/dlopenall"
          "$RUNNER_TEMP/relocated driver/dlopenall" "$RUNNER_TEMP/relocated driver/bundle/"*.dylib
      - name: Inspect Metal 4 device availability
        id: metal
        run: |
          system_profiler SPDisplaysDataType
          /usr/bin/swift -e 'import Metal; for device in MTLCopyAllDevices() { print("device=\(device.name) metal4=\(device.supportsFamily(.metal4))") }'
          # $0 is Swift's closure parameter.
          # shellcheck disable=SC2016
          available=$(/usr/bin/swift -e 'import Metal; print(MTLCopyAllDevices().contains { $0.supportsFamily(.metal4) } ? "true" : "false")')
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" = false ]; then
            echo 'Metal 4 device unavailable; GPU validation is blocked, not passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate KosmicKrisp device creation
        if: steps.metal.outputs.available == 'true'
        run: |
          unset VK_ICD_FILENAMES VK_ADD_DRIVER_FILES VK_LOADER_DRIVERS_SELECT VK_LOADER_DRIVERS_DISABLE
          VK_DRIVER_FILES="$RUNNER_TEMP/relocated driver/bundle/kosmickrisp_icd.json" \
            "$RUNNER_TEMP/relocated driver/bundle/tests/host-probe" \
            "$RUNNER_TEMP/relocated driver/bundle/libvulkan.1.dylib"
      - name: Retain the verified OCI layer for hardware testing
        uses: actions/upload-artifact@v7
        with:
          name: kosmickrisp-oci-test-layer
          path: |-
            ${{ runner.temp }}/oci-kosmickrisp/layer.tar.zst
            ${{ runner.temp }}/oci-kosmickrisp/metadata.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  checks:
    name: OCI transport unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Ensure zstd
        run: command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zstd)
      - name: Run build and runtime helper tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  pe-cache:
    name: Real PE compiler cache coverage
    runs-on: macos-26
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap macOS tools
        run: bash tools/bootstrap_build.sh
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Authenticate GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf "%s" "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Fetch the already-built pinned compiler toolchain
        env:
          SYSROOT_REF: ghcr.io/niltonperimneto/winecx-gptk/sysroot@sha256:a168ed635d6a0152eb096f7821c165bf7e96215a403f978d47ae2c798712f992
        run: |
          mkdir -p .build/toolchain-fixture
          oras pull "$SYSROOT_REF" --output .build/toolchain-fixture
          python3 tools/build/archive.py verify .build/toolchain-fixture sysroot
          zstd -dc .build/toolchain-fixture/layer.tar.zst | python3 tools/build/archive.py check-tar
          zstd -dc .build/toolchain-fixture/layer.tar.zst | tar -xf - llvm-mingw-20240619-ucrt-macos-universal
      - name: Verify real C and C++ cache hits for both PE architectures
        run: bash tests/test_pe_compiler_cache.sh
