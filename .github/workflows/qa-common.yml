name: common QA

# One baseline for winecx, relay12, mesa, winecx-gptk and Whisky, called as
#   uses: niltonperimneto/winecx-gptk/.github/workflows/qa-common.yml@main
# Each check only looks at files the calling repository owns; vendored and
# upstream trees are excluded through the inputs.
on:
  workflow_call:
    inputs:
      exclude:
        description: space-separated git pathspecs to skip, e.g. "third_party src"
        type: string
        default: ''
      shellcheck_severity:
        type: string
        default: warning
      python_rules:
        description: ruff rule selection; the default catches syntax errors and undefined names
        type: string
        default: E9,F63,F7,F82
  # winecx-gptk runs it on itself as well.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    name: actionlint, shellcheck, ruff, whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUFF_VERSION: 0.17.0
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Collect the files this repository owns
        env:
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          pathspec=()
          for path in $EXCLUDE; do pathspec+=(":!$path"); done
          git ls-files -z '*.sh' "${pathspec[@]}" > "$RUNNER_TEMP/shell"
          git ls-files -z '*.py' "${pathspec[@]}" > "$RUNNER_TEMP/python"
      - name: actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v$ACTIONLINT_VERSION/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/shell" ] || { echo "no shell scripts"; exit 0; }
          xargs -0 shellcheck -S "${{ inputs.shellcheck_severity || 'warning' }}" -f gcc < "$RUNNER_TEMP/shell"
      - name: ruff
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/python" ] || { echo "no python"; exit 0; }
          pipx run "ruff==$RUFF_VERSION" --version
          xargs -0 pipx run "ruff==$RUFF_VERSION" check --select "${{ inputs.python_rules || 'E9,F63,F7,F82' }}" \
            --output-format github < "$RUNNER_TEMP/python"
      - name: whitespace in added lines
        if: always() && github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
