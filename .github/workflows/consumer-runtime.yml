name: Validate packaged runtime with Whisky
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Build run containing the verified runtime archive
        type: string
        required: true
      artifact_name:
        description: Runtime archive artifact name
        type: string
        default: whiskywine-gptk-libraries-kosmickrisp-experimental
  workflow_call:
    inputs:
      source_run_id:
        type: string
        default: ''
      artifact_name:
        type: string
        default: whiskywine-gptk-libraries-kosmickrisp-experimental
permissions:
  contents: read
  actions: read
jobs:
  consumer:
    name: Full Whisky consumer suite
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Load consumer pin
        run: sed -n 's/^export //p' tools/build/pins.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: niltonperimneto/Whisky
          ref: ${{ env.WHISKY_CONSUMER_COMMIT }}
          path: consumer
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and relocate the archive
        run: |
          cd downloaded
          shasum -a 256 -c Libraries.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/consumer-runtime"
          tar -xzf Libraries.tar.gz -C "$RUNNER_TEMP/consumer-runtime"
          {
            echo 'Runtime archive SHA-256:'
            cat Libraries.tar.gz.sha256
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate exact packaged bytes with the consumer
        env:
          WHISKY_RUNTIME_LIBRARIES: ${{ runner.temp }}/consumer-runtime/Libraries
          WHISKY_RUNTIME_CONTRACT: ${{ github.workspace }}/contracts/runtime-layout.json
          WHISKY_RUNTIME_CATALOG: ${{ github.workspace }}/runtime-catalog-v2.json
        working-directory: consumer
        run: swift test --package-path WhiskyKit
